<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Domora API consumer — verification requests</title>
    <style>
      :root { color-scheme: light dark; }
      body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 760px; padding: 0 1rem; }
      h1 { font-size: 1.25rem; }
      .source { opacity: 0.7; font-size: 0.85rem; }
      .controls { display: flex; gap: 1rem; align-items: center; margin: 1rem 0; flex-wrap: wrap; }
      table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
      th, td { text-align: left; padding: 0.4rem 0.5rem; border-bottom: 1px solid #8884; }
      th { opacity: 0.7; }
      .paging { display: flex; gap: 1rem; align-items: center; margin-top: 1rem; }
      code { opacity: 0.6; font-size: 0.8rem; }
      #error { color: #c33; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>Domora API consumer</h1>
    <p class="source">API source: <code>https://domora-mu.vercel.app</code> (publicly deployed)</p>

    <div class="controls">
      <label>Status filter
        <select id="filter">
          <option value="">all</option>
          <option value="PENDING">PENDING</option>
          <option value="APPROVED">APPROVED</option>
          <option value="REJECTED">REJECTED</option>
        </select>
      </label>
      <span id="summary"></span>
    </div>

    <table>
      <thead>
        <tr><th>ID</th><th>User ID</th><th>Status</th><th>Created</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>

    <div class="paging">
      <button id="prev" type="button">&larr; Prev</button>
      <button id="next" type="button">Next Page &rarr;</button>
      <span id="pageinfo"></span>
    </div>
    <p id="error"></p>

    <script src="/app.js"></script>
  </body>
</html>
